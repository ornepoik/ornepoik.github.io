<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mama</title>

  <style>
    body {
      margin: 0;
      background: white;
    }

    .container {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    .photo {
      width: 100%;
      display: block;
    }

    .play-button {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: white;
      font-size: 38px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>
  <div class="container">
    <img class="photo" src="photo.JPG" alt="photo">
    <button class="play-button" onclick="playMusic()">▶</button>
  </div>

  <audio id="music" src="music.mp3"></audio>

  <script>
    function playMusic() {
      var music = document.getElementById("music");
      music.play();
    }
  </script>
</body>
</html>
